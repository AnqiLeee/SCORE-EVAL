### model
model_name_or_path: /storage/home/westlakeLab/lianqi/Models/LLM-Research/Meta-Llama-3.1-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: resistance_evaluation_training_exp_fold0
template: llama3
cutoff_len: 8192
max_samples: 10000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/llama3-8b/full_sft_training_exp_fold0_lr1e5_new
logging_steps: 10
save_steps: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: swanlab  # choices: [none, wandb, tensorboard, swanlab, mlflow]
save_total_limit: 5

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
# exp: 1e-5; vanilla: 5e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
eval_dataset: resistance_evaluation_valid_exp_fold0
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 10
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

# val_size: 0.1

### swanlab
use_swanlab: true
swanlab_project: resistance_measurement
swanlab_run_name: training_exp_fold0


